name: Code security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '43 9 * * 1'
permissions:
  contents: read
concurrency:
  group: code-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Semgrep Community Edition
        run: python -m pip install semgrep==1.177.0
      - name: Check source for high-severity security findings
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: python .github/security/scan_code.py
      - name: Retain code-security findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-findings
          path: code-security-report.json
          if-no-files-found: ignore
          retention-days: 7
