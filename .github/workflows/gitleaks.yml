# Server-side secret-scan backstop. Canonical across every Wandzilak repo.
#
# Why the CLI and not gitleaks/gitleaks-action@v2: the Action refuses to run on
# any repo owned by an ORGANIZATION without a paid GITLEAKS_LICENSE secret, and
# every repo of ours lives under `wandzilakwebdesign`. Installed on whistledown
# 2026-08-12, it was red on every single push from that day until 2026-08-25 —
# never once for a leak. A backstop that is always red is worse than no
# backstop, because it teaches you to ignore a red secret-scan. The gitleaks
# BINARY is free and unrestricted; only the Action wrapper is licensed.
#
# The local pre-commit hook (~/projects/.githooks) is the first belt, but it is
# bypassable with --no-verify and absent on any other machine. This is the second.
name: gitleaks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history, not just the tip commit

      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gl.tgz gitleaks
          gitleaks version

      - name: Scan full git history for secrets
        shell: bash
        run: |
          # Use the repo's own allowlist when it has one; plain defaults when it does not.
          CFG=""
          if [ -f .gitleaks.toml ]; then CFG="-c .gitleaks.toml"; fi

          set +e
          gitleaks git . $CFG --no-banner --redact --exit-code 1 2>&1 | tee /tmp/gitleaks.log
          code=${PIPESTATUS[0]}
          set -e

          # A checker that cannot see must never report "clean". If the scan
          # covered zero commits, something upstream broke (shallow checkout,
          # wrong ref, bad log-opts) and a green light here would be a lie.
          n=$(grep -oE '[0-9]+ commits scanned' /tmp/gitleaks.log | tail -1 | grep -oE '^[0-9]+' || true)
          if [ -z "$n" ] || [ "$n" -eq 0 ]; then
            echo "::error::gitleaks scanned 0 commits — this scan is BLIND, not clean. Check the checkout step."
            exit 1
          fi
          echo "scanned $n commits"

          if [ "$code" -ne 0 ]; then
            echo "::error::gitleaks found a likely secret in this repo's history. Findings are redacted above — do NOT paste the real value anywhere. Rotate the credential first, then clean history or add a documented allowlist entry to .gitleaks.toml."
          fi
          exit $code
